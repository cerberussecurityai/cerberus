# Parity fixtures for cerberus_core.normalize_ip.
#
# normalize_ip(ip_string) → str:
#   1. Splits off any IPv6 zone identifier (`%eth0`, `%25en0`).
#   2. Parses with ipaddress.ip_address (Python) / corresponding parser.
#   3. Returns the canonical compressed form.
#   4. On parse failure: returns the input unchanged.
#   5. None → None.
#
# Both runners assert: `normalize_ip(input) == expected`.
#
# See cerberus-core/src/cerberus_core/sanitization.py for the canonical
# implementation.
cases:
  # --- IPv4 ---

  - name: ipv4_passthrough
    input: "192.168.1.1"
    expected: "192.168.1.1"

  - name: ipv4_loopback
    input: "127.0.0.1"
    expected: "127.0.0.1"

  - name: ipv4_zero
    input: "0.0.0.0"
    expected: "0.0.0.0"

  # --- IPv6 canonicalization ---

  - name: ipv6_already_compressed_loopback
    input: "::1"
    expected: "::1"

  - name: ipv6_long_form_compressed
    input: "0000:0000:0000:0000:0000:0000:0000:0001"
    expected: "::1"

  - name: ipv6_link_local
    input: "fe80::1"
    expected: "fe80::1"

  # --- IPv6 zone IDs ---
  # Cerberus strips zone IDs so the same logical address always hashes
  # the same way regardless of which interface routed it.

  - name: ipv6_zone_eth0_stripped
    input: "fe80::1%eth0"
    expected: "fe80::1"

  - name: ipv6_zone_url_encoded_stripped
    input: "fe80::1%25en0"
    expected: "fe80::1"

  - name: ipv6_zone_numeric_stripped
    input: "fe80::1%2"
    expected: "fe80::1"

  # --- IPv4-mapped IPv6 ---
  # Every group is hex. Neither language's default formatter agrees: both
  # print `::ffff:0:0/96` as a dotted quad, so each side formats the groups
  # itself.

  - name: ipv4_mapped_ipv6_canonical_hex
    input: "::ffff:192.168.1.1"
    expected: "::ffff:c0a8:101"

  - name: ipv4_mapped_ipv6_hex_input_idempotent
    input: "::ffff:c0a8:101"
    expected: "::ffff:c0a8:101"

  - name: ipv4_mapped_ipv6_long_form
    input: "0:0:0:0:0:ffff:1.2.3.4"
    expected: "::ffff:102:304"

  - name: ipv4_mapped_ipv6_zero
    input: "::ffff:0.0.0.0"
    expected: "::ffff:0:0"

  - name: ipv4_mapped_ipv6_all_ones
    input: "::ffff:255.255.255.255"
    expected: "::ffff:ffff:ffff"

  - name: ipv4_mapped_ipv6_zone_stripped
    input: "::ffff:192.168.1.1%eth0"
    expected: "::ffff:c0a8:101"

  # --- Other embedded IPv4 forms ---

  - name: ipv4_compatible_ipv6
    input: "::1.2.3.4"
    expected: "::102:304"

  - name: ipv4_compatible_ipv6_all_ones
    # Not IPv4-mapped, though the output looks like it: a `::ffff:` prefix
    # rule would corrupt this one.
    input: "::255.255.255.255"
    expected: "::ffff:ffff"

  - name: ipv4_translated_ipv6
    input: "::ffff:0:1.2.3.4"
    expected: "::ffff:0:102:304"

  # --- Zero-run compression ---

  - name: ipv6_leftmost_of_equal_zero_runs
    input: "1:0:0:1:0:0:1:1"
    expected: "1::1:0:0:1:1"

  - name: ipv6_longest_run_not_leftmost
    input: "1:0:1:0:0:0:1:1"
    expected: "1:0:1::1:1"

  - name: ipv6_single_zero_group_not_compressed
    input: "1:2:0:4:5:6:7:8"
    expected: "1:2:0:4:5:6:7:8"

  - name: ipv6_leading_single_zero_group
    input: "0:1:2:3:4:5:6:7"
    expected: "0:1:2:3:4:5:6:7"

  - name: ipv6_all_zeros
    input: "::"
    expected: "::"

  - name: ipv6_trailing_zero_run
    input: "1:2:3:4:5:6:0:0"
    expected: "1:2:3:4:5:6::"

  - name: ipv6_uppercase_and_leading_zeros
    input: "2001:0DB8:0000:0000:0000:0000:1428:57AB"
    expected: "2001:db8::1428:57ab"

  # --- Failure / passthrough ---

  - name: empty_string_passthrough
    input: ""
    expected: ""

  - name: invalid_string_passthrough
    input: "not-an-ip"
    expected: "not-an-ip"

  - name: garbage_passthrough
    input: "12.foo.3.4"
    expected: "12.foo.3.4"

  - name: null_returns_null
    input: null
    expected: null
